name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Export question data
        run: python scripts/export_pages_data.py
      - name: Build site
        working-directory: client
        env:
          VITE_STATIC: '1'
          BASE_PATH: /Leetcode-questions/pages/
        run: |
          npm ci
          npm run build
      - name: Place the site at /pages
        run: |
          mkdir -p site/pages
          cp -a client/dist/. site/pages/
          cp client/public/.nojekyll site/.nojekyll
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><script>location.replace("/Leetcode-questions/pages/");</script></head><body></body></html>' > site/index.html
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><script>var base="/Leetcode-questions/pages/";var path=location.pathname;if(path===base.slice(0,-1)||path.indexOf(base)===0){sessionStorage.setItem("gh-pages-redirect",location.href);}location.replace(base);</script></head><body></body></html>' > site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
